<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RepoFlow Full Clean Success Cases</title>
  <style>
    :root {
      --bg:#f6f7f9; --panel:#fff; --line:#d8dde5; --text:#18212f; --muted:#667085;
      --header:#1f2933; --header-text:#fff; --hover:#edf5ff; --ok:#0f7b45; --bad:#a33b26;
      --add:#eaf7ef; --add-strong:#d9f0e1; --del:#fdecea; --del-strong:#f7d3cb; --ctx:#fbfcfe;
      --hunk:#eef2f7; --file:#1f2933; --file-text:#fff; --code:#172033; --button:#f8fafc;
      --py-key:#7c3aed; --py-str:#075985; --py-comment:#64748b; --py-call:#0f766e; --py-builtin:#b45309;
    }
    [data-theme="dark"] {
      --bg:#0f141b; --panel:#151b24; --line:#2d3745; --text:#e6edf5; --muted:#9aa8b7;
      --header:#070b10; --header-text:#f8fafc; --hover:#1d2b3d; --ok:#6ee7a8; --bad:#f79a86;
      --add:#13291f; --add-strong:#183a2a; --del:#331d1d; --del-strong:#482623; --ctx:#111820;
      --hunk:#202b39; --file:#0a0f16; --file-text:#f8fafc; --code:#e6edf5; --button:#1d2530;
      --py-key:#c4b5fd; --py-str:#7dd3fc; --py-comment:#94a3b8; --py-call:#5eead4; --py-builtin:#fbbf24;
    }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif; }
    header { min-height:58px; display:flex; align-items:center; gap:12px; padding:10px 18px; background:var(--header); color:var(--header-text); }
    header h1 { font-size:17px; margin:0; }
    .spacer { flex:1; }
    .theme-toggle { border:1px solid rgba(255,255,255,.25); background:transparent; color:var(--header-text); border-radius:6px; padding:6px 10px; cursor:pointer; }
    .theme-toggle:hover { background:rgba(255,255,255,.1); }
    .layout { display:grid; grid-template-columns:390px minmax(0,1fr); height:calc(100vh - 58px); }
    aside { background:var(--panel); border-right:1px solid var(--line); overflow:auto; }
    main { overflow:auto; padding:16px; }
    .filters { position:sticky; top:0; z-index:2; background:var(--panel); padding:12px; border-bottom:1px solid var(--line); }
    input, select { width:100%; margin:4px 0; padding:8px; border:1px solid var(--line); border-radius:6px; background:var(--panel); color:var(--text); }
    .case { padding:10px 12px; border-bottom:1px solid var(--line); cursor:pointer; }
    .case:hover, .case.active { background:var(--hover); }
    .title { font-weight:650; word-break:break-word; }
    .meta { color:var(--muted); font-size:12px; margin-top:3px; }
    .sample { display:inline-flex; min-width:42px; justify-content:center; border-radius:5px; padding:2px 6px; margin-right:6px; background:var(--header); color:var(--header-text); font-size:12px; font-weight:700; }
    .pill { display:inline-flex; border:1px solid var(--line); border-radius:999px; padding:2px 8px; margin:0 5px 5px 0; font-size:12px; background:var(--button); }
    .pill.pass { color:var(--ok); border-color:color-mix(in srgb, var(--ok) 45%, var(--line)); background:color-mix(in srgb, var(--ok) 12%, var(--panel)); }
    .pill.fail { color:var(--bad); border-color:color-mix(in srgb, var(--bad) 45%, var(--line)); background:color-mix(in srgb, var(--bad) 12%, var(--panel)); }
    .pill.warn { color:var(--py-builtin); border-color:color-mix(in srgb, var(--py-builtin) 45%, var(--line)); background:color-mix(in srgb, var(--py-builtin) 12%, var(--panel)); }
    .panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; margin-bottom:14px; overflow:hidden; }
    .panel h2 { margin:0; padding:10px 13px; font-size:15px; background:var(--ctx); border-bottom:1px solid var(--line); }
    .body { padding:12px 13px; }
    .kv { display:grid; grid-template-columns:190px minmax(0,1fr); gap:6px 12px; }
    .kv div:nth-child(odd) { color:var(--muted); }
    pre { white-space:pre-wrap; word-break:break-word; margin:0; color:var(--code); font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
    .json-key { color:var(--py-builtin); }
    .json-str { color:var(--py-str); }
    .json-bool { color:var(--py-key); font-weight:650; }
    .reasoning li, .checklist li { margin:5px 0; }
    .checklist { margin:0; padding-left:20px; }
    .status { padding:14px; color:var(--muted); }
    .error { color:var(--bad); font-weight:650; }
    .diff-wrap { overflow:auto; border:1px solid var(--line); border-radius:6px; }
    .diff-table { width:100%; border-collapse:collapse; table-layout:fixed; font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; color:var(--code); }
    .ln-col { width:24px; }
    .code-col { width:calc(50% - 24px); }
    .diff-table th { position:sticky; top:0; z-index:1; background:var(--ctx); color:var(--muted); text-align:left; padding:7px 8px; border-bottom:1px solid var(--line); }
    .diff-table th.before-head { border-right:2px solid var(--line); }
    .diff-table td { vertical-align:top; border-bottom:1px solid color-mix(in srgb, var(--line) 65%, transparent); }
    .ln { width:24px; min-width:24px; max-width:24px; color:var(--muted); text-align:right; padding:2px 3px; user-select:none; border-right:1px solid var(--line); font-size:11px; }
    .code-cell { white-space:pre-wrap; overflow-wrap:anywhere; padding:2px 8px; }
    .diff-table td:nth-child(2) { border-right:2px solid var(--line); }
    .before.del, .after.add { font-weight:500; }
    .del { background:var(--del); }
    .add { background:var(--add); }
    .del .code-cell { background:var(--del-strong); }
    .add .code-cell { background:var(--add-strong); }
    .ctx { background:var(--ctx); }
    .empty { background:var(--panel); color:var(--muted); }
    .file-row td { background:var(--file); color:var(--file-text); font-weight:700; padding:6px 8px; border-bottom:1px solid var(--line); }
    .hunk-row td { background:var(--hunk); color:var(--muted); font-weight:650; padding:5px 8px; border-bottom:1px solid var(--line); }
    .py-key { color:var(--py-key); font-weight:650; }
    .py-str { color:var(--py-str); }
    .py-comment { color:var(--py-comment); font-style:italic; }
    .py-call { color:var(--py-call); }
    .py-builtin { color:var(--py-builtin); }
    @media (max-width:900px){
      .layout{grid-template-columns:1fr;height:auto}.kv{grid-template-columns:1fr} aside{height:42vh}
      .diff-table { min-width:900px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>RepoFlow Full Clean Success Cases</h1>
    <span id="count">Loading index...</span>
    <span class="spacer"></span>
    <button class="theme-toggle" id="themeToggle" type="button">Dark</button>
  </header>
  <div class="layout">
    <aside>
      <div class="filters">
        <input id="search" placeholder="Search case, technique, library, audit text">
        <select id="technique"><option value="">All techniques</option></select>
      </div>
      <div id="list"><div class="status">Loading case index...</div></div>
    </aside>
    <main>
      <section class="panel"><h2>Review Task</h2><div class="body" id="task">Loading...</div></section>
      <section class="panel"><h2>Case</h2><div class="body" id="caseMeta"></div></section>
      <section class="panel"><h2>LLM Audit Reasoning</h2><div class="body" id="audit"></div></section>
      <section class="panel"><h2>Diff</h2><div class="body"><div id="diff"></div></div></section>
      <section class="panel"><h2>Deterministic Evidence</h2><div class="body"><pre id="evidence"></pre></div></section>
    </main>
  </div>
  <script>
    let caseIndex = [];
    let selectedId = null;
    let selectedCase = null;
    const payloadCache = new Map();
    const el = id => document.getElementById(id);
    const esc = s => (s ?? "").toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    function setTheme(theme) {
      document.documentElement.dataset.theme = theme;
      localStorage.setItem("auditTheme", theme);
      el("themeToggle").textContent = theme === "dark" ? "Light" : "Dark";
    }

    function pyColor(raw) {
      const keywords = new Set("False None True and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield".split(" "));
      const builtins = new Set("dict list set tuple str int float bool len range enumerate zip print isinstance getattr setattr super open sum min max any all sorted map filter next iter type object property Exception ValueError TypeError RuntimeError NotImplementedError".split(" "));
      const token = /(?:[rRuUbBfF]{0,3}(?:"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'))|#[^\n]*|\b[A-Za-z_][A-Za-z0-9_]*\b/g;
      let out = "", pos = 0, match;
      while ((match = token.exec(raw)) !== null) {
        const text = match[0];
        out += esc(raw.slice(pos, match.index));
        if (text.startsWith("#")) out += `<span class="py-comment">${esc(text)}</span>`;
        else if (/^[rRuUbBfF]{0,3}["']/.test(text)) out += `<span class="py-str">${esc(text)}</span>`;
        else if (keywords.has(text)) out += `<span class="py-key">${esc(text)}</span>`;
        else if (builtins.has(text)) out += `<span class="py-builtin">${esc(text)}</span>`;
        else {
          const rest = raw.slice(token.lastIndex);
          out += /^\s*\(/.test(rest) ? `<span class="py-call">${esc(text)}</span>` : esc(text);
        }
        pos = token.lastIndex;
      }
      return out + esc(raw.slice(pos));
    }

    function parseHunk(line) {
      const match = line.match(/^@@\s+-(\d+)(?:,\d+)?\s+\+(\d+)(?:,\d+)?\s+@@/);
      if (!match) return null;
      return { oldLine: Number(match[1]), newLine: Number(match[2]) };
    }

    function diffRow(kind, leftNo, leftText, rightNo, rightText) {
      const leftClass = leftText === null ? "empty" : (kind === "del" || kind === "change") ? "del before" : "ctx";
      const rightClass = rightText === null ? "empty" : (kind === "add" || kind === "change") ? "add after" : "ctx";
      return `<tr>
        <td class="ln ${leftClass}">${leftNo || ""}</td><td class="code-cell ${leftClass}">${leftText === null ? "" : pyColor(leftText)}</td>
        <td class="ln ${rightClass}">${rightNo || ""}</td><td class="code-cell ${rightClass}">${rightText === null ? "" : pyColor(rightText)}</td>
      </tr>`;
    }

    function renderSideBySideDiff(text) {
      const lines = (text || "").split("\n");
      let html = '<div class="diff-wrap"><table class="diff-table"><colgroup><col class="ln-col"><col class="code-col"><col class="ln-col"><col class="code-col"></colgroup><thead><tr><th class="before-head" colspan="2">Before</th><th colspan="2">After</th></tr></thead><tbody>';
      let oldLine = null, newLine = null;
      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        if (line.startsWith("diff ") || line.startsWith("index ") || line.startsWith("--- ") || line.startsWith("+++ ")) {
          html += `<tr class="file-row"><td colspan="4">${esc(line)}</td></tr>`;
          continue;
        }
        if (line.startsWith("@@")) {
          const hunk = parseHunk(line);
          if (hunk) { oldLine = hunk.oldLine; newLine = hunk.newLine; }
          html += `<tr class="hunk-row"><td colspan="4">${esc(line)}</td></tr>`;
          continue;
        }
        if (line.startsWith("-")) {
          const dels = [];
          const adds = [];
          while (i < lines.length && lines[i].startsWith("-") && !lines[i].startsWith("---")) {
            dels.push(lines[i].slice(1));
            i++;
          }
          while (i < lines.length && lines[i].startsWith("+") && !lines[i].startsWith("+++")) {
            adds.push(lines[i].slice(1));
            i++;
          }
          i--;
          const count = Math.max(dels.length, adds.length);
          for (let j = 0; j < count; j++) {
            const left = j < dels.length ? dels[j] : null;
            const right = j < adds.length ? adds[j] : null;
            const leftNo = left !== null && oldLine !== null ? oldLine++ : "";
            const rightNo = right !== null && newLine !== null ? newLine++ : "";
            const kind = left !== null && right !== null ? "change" : left !== null ? "del" : "add";
            html += diffRow(kind, leftNo, left, rightNo, right);
          }
          continue;
        }
        if (line.startsWith("+") && !line.startsWith("+++")) {
          html += diffRow("add", "", null, newLine !== null ? newLine++ : "", line.slice(1));
          continue;
        }
        if (line.startsWith(" ")) {
          const content = line.slice(1);
          html += diffRow("ctx", oldLine !== null ? oldLine++ : "", content, newLine !== null ? newLine++ : "", content);
          continue;
        }
        if (line.trim()) html += `<tr class="file-row"><td colspan="4">${esc(line)}</td></tr>`;
      }
      return html + "</tbody></table></div>";
    }

    function jsonColor(value) {
      let text = esc(JSON.stringify(value, null, 2));
      return text
        .replace(/(&quot;[^&]*?&quot;)(?=:\s)/g, '<span class="json-key">$1</span>')
        .replace(/(:\s*)(&quot;.*?&quot;)/g, '$1<span class="json-str">$2</span>')
        .replace(/\b(true|false|null)\b/g, '<span class="json-bool">$1</span>');
    }

    function visible() {
      const q = el("search").value.trim().toLowerCase();
      const t = el("technique").value;
      return caseIndex.filter(c => {
        if (t && c.run_id !== t) return false;
        if (!q) return true;
        const hay = [
          c.sample_id, c.case_id, c.technique, c.source_library, c.target_library,
          c.verdict, c.confidence, c.description
        ].join(" ").toLowerCase();
        return hay.includes(q);
      });
    }

    function shortTechnique(runId, fallback) {
      if (runId === "agentic_repoflow_opencode_gpt54mini_606") return "Agentic-RepoFlow";
      if (runId === "codex_gpt54mini_plain_prompt") return "Codex";
      if (runId === "migratelib_gpt54mini") return "migratelib";
      return fallback || runId;
    }

    function auditPill(entry) {
      if (entry.audit_pass === true) return '<span class="pill pass">LLM audit pass</span>';
      if (entry.audit_pass === false) return '<span class="pill fail">LLM audit reject</span>';
      return '<span class="pill warn">LLM audit unavailable</span>';
    }

    function gatePill(label, value) {
      if (value === true) return `<span class="pill pass">${esc(label)}</span>`;
      if (value === false) return `<span class="pill fail">${esc(label)}</span>`;
      return `<span class="pill warn">${esc(label)} unavailable</span>`;
    }

    function renderList() {
      const rows = visible();
      if (!rows.length) {
        el("list").innerHTML = '<div class="status">No matching cases.</div>';
        return;
      }
      el("list").innerHTML = rows.map(c => `<div class="case ${selectedId===c.id?'active':''}" onclick="selectCase('${esc(c.id)}')">
        <div><span class="sample">${esc(c.sample_id)}</span><span class="pill pass">clean success</span>${auditPill(c)}<span class="pill">${esc(shortTechnique(c.run_id, c.technique))}</span></div>
        <div class="title">${esc(c.case_id)}</div><div class="meta">${esc(c.technique)} · ${esc(c.source_library)} -> ${esc(c.target_library)}</div>
      </div>`).join("");
    }

    async function selectCase(id) {
      selectedId = id;
      selectedCase = null;
      renderList();
      const entry = caseIndex.find(c => c.id === id);
      if (!entry) return;
      el("task").innerHTML = `Loading case ${esc(entry.sample_id)}...`;
      el("caseMeta").innerHTML = `<div class="kv"><div>Sample index</div><div>${esc(entry.sample_id)}</div><div>Case</div><div>${esc(entry.case_id)}</div><div>Technique</div><div>${esc(entry.technique)}</div></div>`;
      el("audit").innerHTML = "";
      el("diff").innerHTML = "";
      el("evidence").textContent = "";
      try {
        if (!payloadCache.has(id)) {
          const response = await fetch(entry.payload_path);
          if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);
          payloadCache.set(id, await response.json());
        }
        selectedCase = payloadCache.get(id);
        renderSelectedCase();
      } catch (err) {
        el("task").innerHTML = `<span class="error">Failed to load ${esc(entry.payload_path)}: ${esc(err.message)}</span>`;
      }
    }

    function renderSelectedCase() {
      const c = selectedCase;
      if (!c) return;
      const gates = c.gates || {};
      const gateHtml = [
        gatePill("regression", gates.regression_pass),
        gatePill("deterministic anti-cheat", gates.deterministic_anti_cheat_pass),
        gatePill("LLM audit", gates.agentic_audit_pass)
      ].join("");
      el("task").innerHTML = `<p><strong>${esc(c.review.question)}</strong></p><ul class="checklist">${(c.review.what_to_check||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;
      el("caseMeta").innerHTML = `<div class="kv">
        <div>Sample index</div><div>${esc(c.sample_id)}</div>
        <div>Case</div><div>${esc(c.case_id)}</div>
        <div>Technique</div><div>${esc(c.technique)}</div>
        <div>Migration</div><div>${esc(c.source_library)} -> ${esc(c.target_library)}</div>
        <div>Gates</div><div>${gateHtml}</div>
        <div>Copied artifacts</div><div>${esc(c.case_root)}</div>
      </div>`;
      el("audit").innerHTML = `<p>${esc(c.audit.description)}</p><h3>Reasons</h3><ul class="reasoning">${(c.audit.reasons||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ul><h3>Evidence</h3><ul class="reasoning">${(c.audit.evidence||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;
      el("diff").innerHTML = renderSideBySideDiff(c.diff_text || "");
      el("evidence").innerHTML = jsonColor(c.compact_evidence || {});
    }

    function populateTechniqueFilter() {
      const seen = new Map();
      caseIndex.forEach(c => seen.set(c.run_id, c.technique));
      [...seen.entries()].sort((a,b)=>a[1].localeCompare(b[1])).forEach(([run,label]) => {
        const o = document.createElement("option");
        o.value = run;
        o.textContent = label;
        el("technique").appendChild(o);
      });
    }

    el("themeToggle").addEventListener("click", () => {
      const current = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
      setTheme(current);
    });
    setTheme(localStorage.getItem("auditTheme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));

    for (const id of ["search","technique"]) el(id).addEventListener("input", renderList);
    fetch("case_index.json")
      .then(r => {
        if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
        return r.json();
      })
      .then(data => {
        caseIndex = data;
        el("count").textContent = `${caseIndex.length} RepoFlow clean successes`;
        populateTechniqueFilter();
        renderList();
        if (caseIndex.length) selectCase(caseIndex[0].id);
      })
      .catch(err => {
        el("count").textContent = "Index failed to load";
        el("list").innerHTML = `<div class="status error">Could not load case_index.json: ${esc(err.message)}</div>`;
        el("task").innerHTML = `<span class="error">Could not load case_index.json: ${esc(err.message)}</span>`;
      });
  </script>
</body>
</html>
